# Checks of examples/paper_harness.py known to miss the paper, and why.
#
# A listed check that misses is reported as a known deviation and does not fail
# the run; any other miss does. A listed check that no longer misses is
# reported too, so its entry can be removed. Keys are check ids from the
# harness report (--json).

table4.chair.change: >-
  The removed chair is still asserted for 3 frames after its removal: map points
  confirmed over many frames sit at the log-odds clamp (+8), and each frame that
  sees the empty spot subtracts logit(0.9) = 2.2 (Eq. 8), so the fourth such
  frame is the first to retire it. The paper-literal Eq. 9 settings
  (contradiction_window_px 0, prune_min_contradictions 1) give the same lag.
  The synthetic scene sees the spot empty in only 13 frames, so the lag costs
  3/13 of change recall (0.935); over the paper's 10-minute run it would barely
  register, and the paper reports 1.000.
