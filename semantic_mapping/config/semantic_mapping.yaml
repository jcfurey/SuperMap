# "/**" applies to the node under any name and namespace (ros2 launch ...
# namespace:=robot1). Topic names are relative, so they follow the namespace;
# use absolute names ("/camera/...") or launch remappings to pin them.
/**:
  ros__parameters:
    # --- I/O topics -----------------------------------------------------
    # SuperMap consumes accurate pose/geometry from an upstream SLAM backbone
    # rather than estimating it itself; see Sec. IV-A. Point these at whatever
    # topics your SLAM stack publishes.
    rgb_topic: camera/color/image_raw
    camera_info_topic: camera/color/camera_info
    pointcloud_topic: lidar/points
    odometry_topic: odometry
    sync_odometry: true  # false: synchronize RGB/CameraInfo/depth only; camera pose still requires TF

    # Map outputs are latched (transient local, depth 1): late subscribers get
    # the current map at once.
    obj_points_topic: obj_points          # sensor_msgs/PointCloud2, label-coloured, republished on change
    obj_boxes_topic: obj_boxes            # visualization_msgs/MarkerArray (DELETEALL on start and map load)
    objects_topic: objects                # vision_msgs/Detection3DArray: box, id, label hypotheses
    annotated_image_topic: semantic_mapping/annotated_image
    # Share the existing YOLOE inference with full-cloud fusion, preserving
    # tracking/boxes: supermap_msgs/CameraAnnotations. Requires rectified images.
    publish_dense_camera_annotations: false
    dense_camera_annotations_topic: supermap/camera_annotations

    # Camera calibration. false: raw images, CameraInfo D must be all zero
    # (frames with distortion are rejected) and K is used. true: rectified
    # images (image_proc image_rect), projected with P; D and R are ignored.
    camera_images_rectified: false
    dense_camera_images_rectified: false  # deprecated alias of camera_images_rectified

    world_frame: map
    camera_frame: camera_color_optical_frame
    robot_frame: ""        # base frame for grounding (robot position, goal height); empty: camera_frame
    tf_wait_sec: 0.2       # a frame whose transforms have not arrived waits this long before it is dropped
    input_time_jump_reset_sec: 1.0  # clock/input stamps jumping back more than this reset input state (bag --loop)

    # The world_frame -> camera_frame pose (Eq. 3) and the incoming point
    # cloud's own frame -> camera_frame extrinsic are resolved through TF2 at
    # runtime, not a fixed parameter here: this node expects the upstream SLAM
    # backbone to broadcast a dynamic world_frame -> sensor_frame TF transform
    # and a static sensor_frame -> camera_frame extrinsic to be published by a
    # URDF / robot_state_publisher, or by the optional static_transform_publisher
    # launch/semantic_mapping.launch.py includes (publish_static_camera_tf:=true
    # with an explicit camera_x ... camera_qw calibration).

    # Synchronization slop (seconds) for the RGB/CameraInfo/PointCloud2/Odometry
    # approximate-time sync used by the live ROS2 node.
    sync_slop_sec: 0.05
    sync_queue_size: 30

    # Sensor input. Drivers commonly publish best-effort; a best-effort
    # subscription matches both best-effort and reliable publishers, while a
    # reliable one silently receives nothing from a best-effort driver.
    sensor_qos: best_effort          # best_effort | reliable | sensor_data
    sensor_qos_depth: 10
    rgb_compressed: false            # true: rgb_topic carries sensor_msgs/CompressedImage (e.g. .../image_raw/compressed)
    depth_source: pointcloud         # pointcloud: rasterize pointcloud_topic into the camera (LiDAR);
                                     # depth_image: use an RGB-aligned depth image from depth_topic (RGB-D)
    depth_topic: camera/aligned_depth_to_color/image_raw
    depth_scale: 1000.0              # units per meter for 16-bit depth images
    pointcloud_accumulate_scans: 1   # > 1: rasterize the last N scans (carried through TF) for sparse LiDAR;
                                     # pair with depth_fill_radius_px below
    # Occlusion-aware point-cloud depth: a point hides those behind it (by more than the gap) within a disc of
    # this radius, so background seen between sparse foreground returns (or from a LiDAR mounted apart from
    # the camera) is neither lifted into masks nor taken as free space in front of mapped objects. 0 disables.
    pointcloud_splat_radius_m: 0.05
    pointcloud_splat_max_px: 8
    pointcloud_occlusion_gap_m: 0.3
    pointcloud_occlusion_grid_px: 0  # decide occlusion on cells of N px; 0 = auto (exact up to VGA)

    # --- Detector backend -------------------------------------------------
    # One of: offline | yoloe | groundingdino
    detector: yoloe
    detector_rate_hz: 1.0   # asynchronous perception runs slower than SLAM (Sec. IV, V-H); runtime-tunable
    detector_timeout_sec: 2.0  # steady-clock deadline; overdue detections are discarded; runtime-tunable
    max_pending_frames: 30     # later frames wait in order; overflow releases the oldest without detections
    # Relative paths resolve against the package share directory (then the
    # working directory). A real detector with an empty vocabulary fails configure.
    prompts_file: config/prompts.yaml

    # Any backend accepts sam2_checkpoint + sam2_model_cfg: boxes are then
    # refined into instance masks by SAM2 (the paper's pairing, Sec. V-B),
    # which keeps background out of each object's 3D point set.
    yoloe:
      checkpoint: yoloe-v8l-seg.pt
      device: cuda
      confidence_threshold: 0.25
      text_encoder_path: ""  # local MobileCLIP TorchScript asset; required for dense mask export
      sam2_checkpoint: ""       # optional; "-seg" checkpoints already produce masks
      sam2_model_cfg: ""

    groundingdino:
      config_path: ""
      checkpoint_path: ""
      sam2_checkpoint: ""
      sam2_model_cfg: ""
      device: cuda
      box_threshold: 0.35
      text_threshold: 0.25

    offline:
      detections_dir: ""

    # --- Platform (robot self) mask ------------------------------------------
    # A camera on a vehicle sees the vehicle: hood, blade, cab, sensor mounts.
    # Enabled, the robot's links from robot_description are rendered into each
    # image at their TF poses (robot_state_publisher broadcasts every link);
    # frames wait for the description and those transforms like any other TF.
    # Detections mostly on the robot are dropped, the rest lose those pixels,
    # and depth there is unknown: the camera cannot see the returns behind it.
    platform_mask:
      enabled: false
      robot_description_topic: robot_description  # latched std_msgs/String (robot_state_publisher)
      geometry: visual          # visual | collision; a link with none loadable uses the other kind
      mesh_paths: []            # package://pkg/... is looked up as <path>/pkg/... and <path>/share/pkg/...
                                # before the ament index; STL and OBJ built in, other formats need trimesh
      mesh_resolution_m: 0.02   # simplify meshes by merging vertices within cells of this size; 0 keeps them
      near_clip_m: 0.15         # geometry nearer the image plane is ignored (the camera's own housing and lens)
      padding_px: 8             # dilate the mask for calibration and model error
      exclude_links: []         # e.g. the camera's own housing link
      frame_prefix: ""          # robot_state_publisher frame_prefix
      max_overlap: 0.5          # drop a detection with more of its mask (box without one) on the robot

    # --- Pipeline / mapping parameters (Sec. IV-B, IV-C) ------------------
    voxel_size: 0.05                       # meters, per-object point fusion resolution
    min_depth_m: 0.0                      # optical depth limits; rejected readings carry no evidence
    max_depth_m: 0.0                      # 0 disables the upper limit (set for the sensor/deployment)
    bbox_trim_percentile: 0.0             # 0: full bounds; e.g. 2: per-axis 2nd–98th percentile bounds
    mask_depth_mad_factor: 0.0            # optional depth outlier rejection inside masks; 0 disables
    mask_depth_min_tolerance_m: 0.15      # minimum median-depth tolerance when the mask gate is enabled
    foreground_depth_gap_m: 0.0          # 0 disables; split raw masked depths at larger gaps and keep nearest supported layer
    foreground_depth_min_points: 5       # real depth pixels before filling, not synthesized neighbours
    foreground_depth_min_fraction: 0.1   # fraction of valid masked readings supporting a layer
    foreground_depth_min_image_span: 0.0 # 0 disables; require this fraction of mask width AND height in real returns
    foreground_depth_max_extent_m: 0.0   # 0 disables; reject compact foreground geometry exceeding this extent on any camera axis
    foreground_depth_labels: [person]    # apply only to compact foreground classes; preserve deep structures
    # A mask bleeds onto the ground at an object's base; with a LiDAR those ground rings are nearer than the
    # object and were taken as its depth (box on the ring in front, sliding with the vehicle). Masked readings
    # less than ground_clearance_m above the local ground (world z up) are dropped when at least
    # ground_exclusion_min_returns stand above it. Ground classes, flat objects, and masks without a ground
    # fitted below the camera keep every reading. ~1 ms per masked detection on dense depth.
    ground_exclusion: true
    ground_exclusion_min_returns: 3
    ground_surface_labels: [floor, ground, road, sidewalk, pavement, grass, terrain, carpet, rug, mat]
    # Outdoor sparse-LiDAR options (README "Outdoor objects on sparse LiDAR"). All off by default.
    # foreground_depth_largest_labels: []  # of foreground_depth_labels: keep the supported layer with the most
    #                                      # real returns, not the nearest (often the ground strip in front)
    # ground_removal_labels: []            # always drop masked returns on the local ground (plane fitted in world
    #                                      # frame, z up, to returns in/around the mask), even when none are left
    ground_clearance_m: 0.15             # returns lower than this above the fitted ground are dropped
    ground_context_px: 20                # margin around the mask box whose returns inform the ground fit
    ground_max_slope: 0.25               # steeper fitted ground (rise/run) falls back to a level ground
    # mask_completion_labels: []           # complete the mask silhouette at the median range of its kept returns
    #                                      # (geometry only; never used as depth evidence or for layer selection)
    mask_completion_min_returns: 3       # kept real returns needed for completion (fewer: ground contact, if enabled)
    mask_completion_stride_px: 4         # completed pixels on this grid (+ silhouette extremes), within max_points_per_detection
    # ground_contact_depth_labels: []      # masks with too few returns: range where the bottom-centre ray meets the
    #                                      # fitted ground (no fit, off-image bottom, or beyond max_depth_m: no geometry)
    bbox_min_support: 1                  # >1: static boxes use only points re-hit in >= N frames (young: all); 1 = off
    bbox_support_radius_m: 0.0           # a frame re-hits a point within this distance; 0 = voxel diagonal (LiDAR: ~0.3)
    bbox_support_miss: 0.0               # >0: points a matched frame looked at (in image, not occluded) but did not re-hit lose this support
    bbox_support_cull_at: 0.0            # with bbox_support_miss: points whose support falls to this are removed
    bbox_support_max: 0.0                # cap per-point support so old regions can still decay; 0 = uncapped
    existence_hit_gain: 0.0              # >0: instance existence log-odds += gain * score per matched detection
    existence_miss_penalty: 1.0          # ... -= this per frame the detector could have seen it and did not
    existence_cull_log_odds: -3.0        # ... below this the instance is culled (disappeared), even when confirmed
    existence_max_log_odds: 6.0          # ... capped here so long-lived instances can still be culled
    # class_size_limits: []                # 'label:D' (max 3D diagonal) or 'label:H,V' (max footprint diagonal,
    #                                      # max height), metres: oversized observations lose geometry, and
    #                                      # associations/merges growing an instance past its limit are refused
    dynamic_geometry_enabled: false      # latest supported geometry instead of unioning past positions
    dynamic_geometry_labels: [person]    # identity and trajectory survive each geometry replacement
    dynamic_geometry_min_extent_fraction: 0.0 # 0 disables; retire a contradicted body instead of retaining small fragments
    tau_eps: 0.15                          # meters, geometric consistency threshold (Eq. 9)
    max_points_per_object: 5000        # voxels kept per instance (40 bytes each); 5 cm voxels give ~2-3k for furniture
    max_points_per_detection: 4000
    prune_log_odds: -1.5                   # Eq. (8): points whose occupancy log-odds fall below this are dropped
    prune_min_contradictions: 2            # contradicting frames a fresh point needs before it is pruned (1: single frame)
    contradiction_window_px: 1             # nearest depth in this window must also lie behind a point to contradict it; 0 = off
    prune_membership: -1.5                 # Sec. IV-B.4: points visible but repeatedly outside the detected region are dropped
    membership_margin_px: 2.0              # tolerance around a box-only detection for the membership test
    active_occupied_fraction: 0.6
    disappeared_occupied_fraction: 0.2
    max_occlusion_frames: 30
    min_label_confidence: 0.4              # Eq. (10) instance-level confirmation threshold
    min_observations_for_confidence_check: 5
    min_hits_to_confirm: 2
    tentative_max_age: 10                  # missed detector observations; geometry-only frames do not count
    # Table V ablation switches (Sec. V-E; examples/evaluate.py --ablation). All true is the full system.
    use_2d_tracker: true                   # false: associate in 3D only (re-activation, re-identification)
    use_semantic_fusion: true              # false: latest detection's label, no Eq. (10), no membership pruning
    use_geometric_consistency: true        # false: no Eq. (7)-(9); points never pruned, objects never retired
    # Staged association (Sec. IV-B): 2D high-confidence -> 2D low-confidence
    # (ByteTrack) -> 3D-aware re-activation -> relabelling -> re-identification -> spawn.
    association_iou_threshold: 0.3
    high_score_threshold: 0.5              # detections below this only match existing tracks, never spawn
    low_score_iou_threshold: 0.2
    reactivation_iou_threshold: 0.05       # 3D box IoU to re-attach a detection to an existing object
    reactivation_margin_m: 0.25            # or: one centroid inside the other's box expanded by this
    label_compatibility_min_mass: 0.1      # belief mass a label needs in an instance to fuse or merge into it
    match_max_gap_m: 1.0                   # 2D->3D validation (Fig. 2): split a 2D match lifting farther from the
                                           # instance's box than this (a different object behind it); 0 = off
    relabel_min_overlap: 0.5               # a detection under a label the instance hasn't taken joins a visible track
                                           # when 2D boxes overlap and this much of the smaller 3D box lies in the
                                           # other; Eq. (10) then weighs the label; 0 = off
    min_points_for_3d_association: 5
    merge_iou_threshold: 0.3               # duplicate instances (same label) merged when their 3D boxes overlap this much
    merge_distance_m: 0.25                 #   ... or their centroids are this close; the older ID survives
    disappeared_prune_grace_frames: 60      # release a disappeared instance's points after N frames; its identity stays
    max_retired_instances: 1000             # retired identities kept for re-identification (least recently seen evicted)
    # Re-identification: an unmatched detection re-attaches to a retired
    # instance with a compatible label when it is back in the same place, or
    # anywhere if its appearance matches (relocation). Embedders:
    # color_histogram (no model), clip (open_clip_torch), none.
    appearance_embedder: color_histogram
    embedder_device: cuda
    clip_model: ViT-B-32
    clip_pretrained: openai
    reid_enabled: true
    reid_min_similarity: 0.85               # cosine similarity floor; ~0.85 for histograms, ~0.9 for CLIP
    reid_max_age_sec: 0.0                   # 0 = re-identify no matter how long ago it was last seen
    # A relocation (a provisional instance folded into a just-retired one, or a retired instance
    # re-identified elsewhere by appearance) is only accepted this close to where it was ...
    reconcile_max_distance_m: 10.0
    reconcile_max_gap_sec: 120.0            # ... and this soon after it was last seen; 0 disables either bound

    scene_graph_cluster_radius: 2.0        # meters, maximum centroid distance for candidate relation pairs
    scene_graph_z_tolerance: 0.1           # meters, "On" predicate z_min ~= z_max tolerance
    scene_graph_xy_iou_threshold: 0.05     # gamma in Eq. On(A,B) predicate
    scene_graph_beside_max_distance: 1.0   # meters
    # Class-dependent "on" (Sec. IV-C): only these classes can support another
    # object; an empty list makes the predicate purely geometric.
    scene_graph_support_classes: [table, desk, shelf, counter, countertop, cabinet, dresser, nightstand,
                                  bed, sofa, couch, bench, stool, chair, cart, box, floor]

    size_prior_weight: 0.0                 # 2D box size: 0 = Kalman only, 1 = projected 3D box (visible part)
    depth_fill_radius_px: 0                # fill empty depth pixels from neighbours within N px (LiDAR: 2-3; dense depth: 0)
    cull_out_of_view: true                 # skip per-point evidence for instances entirely outside the view

    publish_rate_hz: 5.0                   # 4D scene graph update rate (Sec. V-H); runtime-tunable
    publish_disappeared_objects: true      # false hides retired geometry in RViz; history/query data remain intact; runtime-tunable
    stats_log_period_sec: 10.0             # log module rates (detector / 3D mapping / scene graph) every N s; 0 = off

    # --- Language grounding (Sec. IV-D) ----------------------------------
    # Primary interface: the ~/ground_instruction action
    # (supermap_msgs/action/GroundInstruction) with feedback and cancel.
    # Legacy: a std_msgs/String instruction (or JSON {"instruction", "request_id"})
    # on query_topic; the answer is JSON on answer_topic with the request_id.
    # Either way the first approach pose goes to goal_topic and all of them,
    # in order, to waypoints_topic (nav_msgs/Path). Goals are approach poses
    # goal_standoff_m outside the object's footprint, facing it -- never the
    # occupied centroid.
    query_topic: semantic_mapping/query
    answer_topic: semantic_mapping/answer
    goal_topic: semantic_mapping/goal
    waypoints_topic: semantic_mapping/waypoints
    grounding_max_queue: 4       # requests queued or running; more are rejected (action) or answered "busy"
    goal_standoff_m: 0.6         # distance from the object's footprint (use at least the robot radius + inflation)
    goal_clearance_m: 0.2        # approach poses avoid other objects' footprints grown by this
    goal_use_robot_z: true       # goal height = robot_frame height; goal_z_m when the robot pose is unknown
    goal_z_m: 0.0
    nav2_send_goal: false        # also send the first approach pose to Nav2 (nav2_msgs NavigateToPose)
    nav2_action_name: navigate_to_pose
    vlm:
      # keyword | openai_compatible | anthropic. "keyword" is a deterministic
      # stand-in with no network access (matches labels named in the
      # instruction) so the node runs without credentials; use a real backend
      # for relational/temporal reasoning. API keys come from the environment
      # variable named in api_key_env (defaults: OPENAI_API_KEY / ANTHROPIC_API_KEY).
      client: keyword
      model: ""            # e.g. gpt-4o, gemini-2.0-flash (via its OpenAI-compatible endpoint), claude-opus-5
      base_url: ""         # e.g. https://api.openai.com/v1, http://localhost:11434/v1 (Ollama)
      api_key_env: ""
      max_tokens: 0        # response budget incl. thinking; 0: backend default (Anthropic 16000, OpenAI-compatible 4096)
      max_retries: -1      # retries on timeouts / 429 / 5xx / 529; -1: backend default (2)
      retry_backoff_s: 0.0 # initial backoff; 0: backend default (1 s)
      local_radius_m: 0.0  # > 0: serialize only objects within this distance of the robot (local subgraph)
      max_objects: 0       # > 0: cap the number of serialized objects (nearest first)
      stale_after_sec: 30.0  # occluded instances unseen longer than this are marked "may no longer be there"

    # --- Persistence (living memory across sessions) ----------------------
    # map_load_path: restore a saved map at startup. Restored objects resume
    # as "occluded" until re-observed; their IDs, points, labels, and
    # histories carry over, and new IDs continue from the saved counter.
    # map_save_path: where autosave writes and ~/save_map writes when called
    # with an empty path. ~/save_map and ~/load_map (supermap_msgs/srv/SaveMap,
    # LoadMap) take an explicit directory; an empty ~/load_map path reads
    # map_load_path, falling back to map_save_path.
    map_load_path: ""
    map_save_path: ""
    map_autosave_sec: 0.0    # > 0: save to map_save_path every N seconds
