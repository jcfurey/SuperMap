[develop]
script_dir=$base/lib/semantic_mapping
[install]
install_scripts=$base/lib/semantic_mapping

[flake8]
# Used by test/test_flake8.py (ament_flake8 --config setup.cfg). The code base
# predates the ament style: double quotes, lines up to ~145 columns and
# stdlib/third-party/local import groups that are not google-ordered, so those
# pure style checks are off. Everything pyflakes reports (F: unused imports,
# undefined names, ...) and pycodestyle errors other than the ones listed stay on.
# The first line repeats ament_flake8's own defaults, except that all D
# (docstring) codes are off: test_pep257.py checks docstrings, and Jazzy's
# ament_flake8 loads flake8-docstrings while newer distros do not.
extend-ignore =
    B902,C816,D,I202,
    Q000,I100,I101,I201,
    A002,A003,A005,
    C401,C402,C408,
    CNL100,E127,E128,E231,E305,E702,E731,E741
import-order-style = google
max-line-length = 145
show-source = true
statistics = true
