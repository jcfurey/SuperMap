name: CI

# Pushes to the long-lived branches and pull requests; a PR branch is tested
# once (by its pull_request run), not twice.
on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: semantic_mapping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy PyYAML opencv-python-headless "pytest>=7.4,<8"
      - name: Build the compiled kernels (supermap_kernels)
        run: python -m pip install ../supermap_kernels
      - name: Generate the synthetic scene
        run: python examples/prepare_example_dataset.py
      - name: Unit tests (no ROS; test/ros and the ament linters are skipped without it)
        run: python -m pytest test -q --ignore=test/ros --ignore=test/test_flake8.py --ignore=test/test_pep257.py --ignore=test/test_copyright.py
      - name: Unit tests on the NumPy/SciPy fallback (kernels disabled)
        env:
          SUPERMAP_NATIVE_KERNELS: "0"
        run: python -m pytest test -q --ignore=test/ros --ignore=test/test_flake8.py --ignore=test/test_pep257.py --ignore=test/test_copyright.py
      - name: Offline pipeline, evaluation, query, benchmark
        run: |
          python examples/example.py > /dev/null
          python examples/evaluate.py --json results.json
          python examples/query.py "go to the sofa, then the shelf"
          python examples/benchmark.py
      - name: Metric regression gate (Sec. V-D / V-B on the synthetic scene)
        run: |
          python - <<'EOF'
          import json
          r = json.load(open("results.json"))
          temporal, seg = r["temporal"], r["segmentation"]
          checks = {
              "mean detection recall >= 0.90": temporal["mean_detection_recall"] >= 0.90,
              "mean change recall >= 0.90": temporal["mean_change_recall"] >= 0.90,
              "final-map F1 >= 0.80": temporal["final_map"]["f1"] >= 0.80,
              "instance IDs created <= 13": temporal["total_instance_ids_created"] <= 13,
              "identity kept across relocation and return": temporal["identity_consistency"]["consistent"] == 2,
              "mIoU without background >= 0.95": seg["class_level"]["without_background"]["miou"] >= 0.95,
              "mAP50 >= 0.95": seg["instance_level"]["ap50"]["map"] >= 0.95,
          }
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          assert all(checks.values()), "metric regression"
          EOF
      - name: Paper harness (Sec. V results; synthetic suite, report in the job summary)
        if: matrix.python-version == '3.12'
        run: python examples/paper_harness.py --markdown paper_report.md --append_summary "$GITHUB_STEP_SUMMARY"

  docker-lite:
    name: docker image (ROS 2 Jazzy, no detector stack) + colcon test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/Dockerfile --build-arg INSTALL_DETECTORS=0 -t supermap/semantic_mapping:lite .
      - name: colcon build + colcon test, offline example, and launch file inside the image
        run: |
          docker run --rm supermap/semantic_mapping:lite bash -lc '
            set -e
            python3 examples/prepare_example_dataset.py
            cd /workspace
            colcon build --symlink-install --packages-select supermap_msgs supermap_kernels semantic_mapping
            source install/setup.bash
            ROS_DOMAIN_ID=42 colcon test --packages-select supermap_msgs semantic_mapping \
              --event-handlers console_direct+ --return-code-on-test-failure
            colcon test-result --verbose
            cd /workspace/src/SuperMap/semantic_mapping
            python3 examples/example.py > /dev/null
            ros2 launch semantic_mapping semantic_mapping.launch.py --show-args > /dev/null
            echo "image OK"'
